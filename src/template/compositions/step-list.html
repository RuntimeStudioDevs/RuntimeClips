<!doctype html>
<!--
  Lista de Pasos (Step List): para consejos, tips o listas secuenciales (1, 2, 3).
  Tokens: {{ID}}, {{STEP_NUM}}, {{STEP_TEXT}}, {{DURATION}}, {{BAND_TOP}}, {{BAND_HEIGHT}}.
-->
<html lang="es">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template id="{{ID}}-template">
      <style>
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
        }
        #{{ID}}-wrap {
          position: absolute;
          left: 65px;
          right: 65px;
          top: {{BAND_TOP}}px;
          height: {{BAND_HEIGHT}}px;
          display: flex;
          align-items: center;
          justify-content: center;
        }
        #{{ID}}-badge {
          display: flex;
          align-items: center;
          gap: 20px;
          padding: 16px 32px 18px 20px;
          border-radius: 999px;
          background: rgba(18, 20, 28, 0.95);
          border: 2px solid var(--accent);
          box-shadow: 0 12px 28px rgba(0, 0, 0, 0.6);
          font-family: var(--font);
        }
        .step-circle {
          width: 52px;
          height: 52px;
          border-radius: 50%;
          background: var(--accent);
          color: #0d0e12;
          display: flex;
          align-items: center;
          justify-content: center;
          font-weight: 900;
          font-size: 26px;
        }
        .step-label {
          font-size: 32px;
          font-weight: 900;
          color: #ffffff;
          text-transform: uppercase;
          letter-spacing: 0.02em;
        }
      </style>
      <div id="root" data-composition-id="{{ID}}" data-width="1080" data-height="1920">
        <div id="{{ID}}-wrap">
          <div id="{{ID}}-badge">
            <div class="step-circle">{{STEP_NUM}}</div>
            <div class="step-label">{{STEP_TEXT}}</div>
          </div>
        </div>
      </div>
      <script>
        (function () {
          const tl = gsap.timeline({ paused: true });
          const out = {{DURATION}} - 0.25;
          tl.fromTo(
            "#{{ID}}-badge",
            { opacity: 0, scale: 0.5, y: 20 },
            { opacity: 1, scale: 1, y: 0, duration: 0.4, ease: "back.out(2)" },
            0,
          );
          tl.to("#{{ID}}-badge", { opacity: 0, scale: 0.8, duration: 0.22, ease: "power2.in" }, out);
          window.__timelines["{{ID}}"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
