<!doctype html>
<!--
  Badge de palabra clave: una píldora que salta en el momento en que se dice
  la palabra, flota un instante y se va.
  Tokens: {{ID}}, {{TEXT}}, {{SIZE}}, {{DURATION}}, {{BAND_TOP}}, {{BAND_HEIGHT}}.
-->
<html lang="es">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template id="{{ID}}-template">
      <style>
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
        }
        #{{ID}}-wrap {
          position: absolute;
          left: 65px;
          right: 65px;
          top: {{BAND_TOP}}px;
          height: {{BAND_HEIGHT}}px;
          display: flex;
          align-items: center;
          justify-content: center;
        }
        #{{ID}}-pill {
          display: flex;
          align-items: center;
          gap: 22px;
          padding: 20px 44px 22px 34px;
          border-radius: 999px;
          background: var(--accent);
          box-shadow: 0 10px 0 rgba(0, 0, 0, 0.55);
          font-family: var(--font);
          font-weight: 900;
          font-size: {{SIZE}}px;
          line-height: 1;
          letter-spacing: 0.01em;
          text-transform: uppercase;
          white-space: nowrap;
          color: #0a0a0e;
        }
        #{{ID}}-dot {
          width: 26px;
          height: 26px;
          border-radius: 50%;
          background: #0a0a0e;
        }
      </style>
      <div id="root" data-composition-id="{{ID}}" data-width="1080" data-height="1920">
        <div id="{{ID}}-wrap">
          <div id="{{ID}}-pill">
            <div id="{{ID}}-dot"></div>
            <div id="{{ID}}-text">{{TEXT}}</div>
          </div>
        </div>
      </div>
      <script>
        (function () {
          const tl = gsap.timeline({ paused: true });
          const out = {{DURATION}} - 0.25;
          tl.fromTo(
            "#{{ID}}-pill",
            { opacity: 0, scale: 0.4, rotation: -8 },
            { opacity: 1, scale: 1, rotation: -3, duration: 0.38, ease: "back.out(2.2)" },
            0,
          );
          tl.fromTo("#{{ID}}-dot", { scale: 1 }, { scale: 1.5, duration: 0.2, yoyo: true, repeat: 1, ease: "power1.inOut" }, 0.3);
          tl.to("#{{ID}}-pill", { y: -10, rotation: -1, duration: Math.max(0.2, out - 0.4), ease: "sine.inOut" }, 0.4);
          tl.to("#{{ID}}-pill", { opacity: 0, scale: 0.7, duration: 0.25, ease: "power2.in" }, out);
          window.__timelines["{{ID}}"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
