<!doctype html>
<!--
  Composición anfitriona de RuntimeClips (1080x1920, pantalla completa).
  renderer.mjs la copia a projects/<run>/ y rellena los {{TOKENS}} y el bloque
  entre los marcadores OVERLAYS.

  Capas (z-index):
    1  #talent       el video del orador, 100 % del lienzo
    2  .layer        motion graphics transparentes (compositions/*.html)
    3  .zone-captions subtítulos karaoke

  Zonas seguras de Reels/TikTok: texto solo en x 65-1015, y 270-1248, y nada a
  la derecha de x 960 por debajo de y 1100 (columna de botones).
-->
<html lang="es" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/gsap.min.js"></script>
    <style id="brand">
      @font-face {
        font-family: "RuntimeClips Sans";
        font-weight: 700;
        font-display: block;
        src: url("assets/fonts/Inter-700.woff2") format("woff2");
      }
      @font-face {
        font-family: "RuntimeClips Sans";
        font-weight: 800;
        font-display: block;
        src: url("assets/fonts/Inter-800.woff2") format("woff2");
      }
      @font-face {
        font-family: "RuntimeClips Sans";
        font-weight: 900;
        font-display: block;
        src: url("assets/fonts/Inter-900.woff2") format("woff2");
      }
      :root {
        --accent: {{ACCENT}};
        --ink: #ffffff;
        --card: rgba(10, 10, 14, 0.86);
        --stroke: #000000;
        --font: "RuntimeClips Sans", sans-serif;
      }
    </style>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #000;
        font-family: var(--font);
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
      }
      /* Capa 1: el orador llena el lienzo. El clip ya llega reencuadrado a 1080x1920. */
      #talent {
        position: absolute;
        left: 0;
        top: 0;
        width: 1080px;
        height: 1920px;
        object-fit: cover;
        z-index: 1;
      }
      /* Capa 2: overlays transparentes a lienzo completo. */
      #root > .layer {
        position: absolute;
        left: 0;
        top: 0;
        width: 1080px;
        height: 1920px;
        z-index: 2;
        pointer-events: none;
      }
      /* Capa 3: franja de subtítulos, zona segura media-baja. */
      #root > .zone-captions {
        position: absolute;
        left: 0;
        top: {{CAPTIONS_TOP}}px;
        width: 1080px;
        height: {{CAPTIONS_HEIGHT}}px;
        z-index: 3;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="clip"
      data-start="0"
      data-duration="{{DURATION}}"
      data-fps="30"
      data-width="1080"
      data-height="1920"
    >
      <video
        id="talent"
        src="assets/clip.mp4"
        playsinline
        data-has-audio="true"
        data-start="0"
        data-duration="{{DURATION}}"
        data-track-index="1"
      ></video>

      <!-- OVERLAYS:START (generado por renderer.mjs desde overlays.json) -->
      <!-- OVERLAYS:END -->

      <div
        id="el-captions"
        class="zone-captions"
        data-composition-id="captions"
        data-composition-src="compositions/captions.html"
        data-track-kind="captions"
        data-start="0"
        data-duration="{{DURATION}}"
        data-track-index="{{CAPTIONS_TRACK}}"
        data-width="1080"
        data-height="{{CAPTIONS_HEIGHT}}"
      ></div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["clip"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
